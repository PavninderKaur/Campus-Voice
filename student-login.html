
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Campus Voice</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #FFF8F4;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            color: #B83232;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h2 {
            color: #3D2925;
            margin-bottom: 8px;
        }

        .heading p {
            color: #94776C;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
            color: #3D2925;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #E8CFC4;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            background: #FFFCFA;
        }

        input:focus {
            border-color: #E76F35;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #B83232;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #E76F35;
        }

        .back-link {
            text-align: center;
            margin-top: 22px;
        }

        .back-link a {
            color: #B83232;
            text-decoration: none;
            font-size: 14px;
        }

        .message {
            color: #B83232;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">Campus Voice</div>

        <div class="heading">
            <h2>Student Login</h2>
            <p>Login to access your student portal</p>
        </div>

        <form id="studentLoginForm">

            <div class="form-group">
                <label for="studentName">Student Name (Optional)</label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                >
            </div>

            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter your Student ID"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">Login to Student Portal</button>

            <p id="loginMessage" class="message"></p>

        </form>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

    <script>
        const loginForm = document.getElementById("studentLoginForm");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const studentName =
                document.getElementById("studentName").value.trim();

            const studentId =
                document.getElementById("studentId").value.trim();

            const password =
                document.getElementById("password").value;

            if (!studentId || !password) {
                document.getElementById("loginMessage").textContent =
                    "Please enter your Student ID and Password.";
                return;
            }

            // Prototype login only: this does not verify credentials.
            sessionStorage.setItem("studentName", studentName);
            sessionStorage.setItem("studentId", studentId);
            sessionStorage.setItem("studentLoggedIn", "true");

            window.location.href = "student-dashboard.html";
        });
    </script>

</body>
</html>
